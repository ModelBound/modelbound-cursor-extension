name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run compile
      - run: npm run test:unit
      - name: Extension host smoke (main only)
        if: github.ref == 'refs/heads/main'
        run: xvfb-run -a npm test
      - name: Package VSIX (marketplace readme omits external SVG badges)
        run: |
          grep -v 'modelbound.co/api/badge/skills.svg' README.md > README.vscode.md
          npx --yes @vscode/vsce package --no-dependencies --readme-path README.vscode.md
          rm README.vscode.md
